name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Hermetic CI: the oracle corpus ref is pinned, never floating.
  # Bump this line deliberately with each corpus ride.
  CORPUS_REF: v0.3.41

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin
      - run: maturin build --release --out dist
      - run: pip install --no-index --find-links dist chemomer
      - run: python scripts/smoke_py.py
      # The PyO3 transport, gated by the oracle: every identity
      # fixture's molfile through the built module, byte-compared
      # against the recorded identifier / AuxInfo / InChIKey. The
      # engine's CI owns the full gate; this one covers the Python
      # boundary, which the smoke test alone cannot.
      - name: Clone the inchi-tests oracle corpus at $CORPUS_REF
        uses: actions/checkout@v7
        with:
          repository: chemomer/inchi-tests
          ref: ${{ env.CORPUS_REF }}
          path: .inchi-tests
      - run: python scripts/oracle_gate.py .inchi-tests
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
